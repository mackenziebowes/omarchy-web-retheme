<!doctype html>
<meta charset="utf-8">
<title>omarchy-web-retheme header</title>
<style>html,body{margin:0;background:#11111b}canvas{display:block}</style>
<canvas id="c" width="1600" height="600"></canvas>
<script>
// Renders the README header. Open in a browser, or see docs/ for the PNG.
const c = document.getElementById("c");
const g = c.getContext("2d");
const W = c.width, H = c.height;
const SANS = '"Inter","Noto Sans","DejaVu Sans",system-ui,sans-serif';
const MONO = '"CaskaydiaMono Nerd Font Mono","JetBrains Mono","Noto Sans Mono",monospace';

// Real Omarchy theme palettes (from /usr/share/omarchy/themes/*/colors.toml).
const THEMES = {
  catppuccin: { bg: "#1e1e2e", alt: "#313244", line: "#45475a", fg: "#cdd6f4", dim: "#7f849c", accent: "#89b4fa",
    dots: ["#f38ba8", "#f6b6ab", "#f9e2af", "#a6e3a1", "#94e2d5", "#89b4fa", "#f5c2e7"] },
  kanagawa: { bg: "#1f1f28", alt: "#223249", line: "#363646", fg: "#dcd7ba", dim: "#727169", accent: "#7e9cd8" },
  gruvbox: { bg: "#282828", alt: "#3c3836", line: "#504945", fg: "#d4be98", dim: "#928374", accent: "#d8a657" },
  light: { bg: "#ffffff", alt: "#f1f3f4", line: "#dadce0", fg: "#202124", dim: "#80868b", accent: "#1a73e8" },
};

const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
const fill = (col) => { g.fillStyle = col; g.fill(); };

function background() {
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#0d0d16");
  bg.addColorStop(1, "#1a1a2b");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // dot grid
  g.fillStyle = "rgba(205,214,244,0.06)";
  for (let x = 24; x < W; x += 32) for (let y = 24; y < H; y += 32) g.fillRect(x, y, 2, 2);
  // glows behind the windows
  for (const [x, y, r, col] of [[1150, 160, 420, "rgba(137,180,250,0.20)"], [1350, 520, 360, "rgba(245,194,231,0.14)"], [900, 480, 300, "rgba(166,227,161,0.08)"]]) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, col); rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
}

// Media keeps its own colors in every theme, which is the point.
function photo(x, y, w, h, hue) {
  g.save(); rr(x, y, w, h, 8); g.clip();
  const l = g.createLinearGradient(x, y, x + w, y + h);
  l.addColorStop(0, `hsl(${hue},85%,62%)`); l.addColorStop(1, `hsl(${hue + 55},80%,45%)`);
  g.fillStyle = l; g.fillRect(x, y, w, h);
  g.fillStyle = `hsla(${hue + 30},90%,80%,0.55)`;
  g.beginPath(); g.arc(x + w * 0.72, y + h * 0.3, h * 0.22, 0, 7); g.fill();
  g.fillStyle = `hsla(${hue + 200},60%,25%,0.55)`;
  g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + w * 0.35, y + h * 0.5); g.lineTo(x + w * 0.62, y + h * 0.8); g.lineTo(x + w * 0.82, y + h * 0.58); g.lineTo(x + w, y + h); g.fill();
  g.restore();
}

function site({ x, y, w, h, rot, p, scale = 1, shadow = 0.5 }) {
  g.save();
  g.translate(x + (w * scale) / 2, y + (h * scale) / 2); g.rotate(rot); g.scale(scale, scale); g.translate(-w / 2, -h / 2);
  g.shadowColor = `rgba(0,0,0,${shadow})`; g.shadowBlur = 50; g.shadowOffsetY = 24;
  rr(0, 0, w, h, 16); fill(p.bg);
  g.shadowColor = "transparent";
  rr(0.5, 0.5, w - 1, h - 1, 16); g.strokeStyle = p.line; g.lineWidth = 1.5; g.stroke();
  g.save(); rr(0, 0, w, h, 16); g.clip();

  g.fillStyle = p.alt; g.fillRect(0, 0, w, 42);
  ["#ff5f57", "#febc2e", "#28c840"].forEach((col, i) => { g.beginPath(); g.arc(22 + i * 18, 21, 5.5, 0, 7); fill(col); });
  rr(88, 9, w - 112, 24, 12); fill(p.bg);
  g.fillStyle = p.dim; g.font = `12px ${MONO}`; g.textBaseline = "middle"; g.fillText("example.com", 106, 22);

  g.beginPath(); g.arc(30, 72, 10, 0, 7); fill(p.accent);
  [60, 44, 52].forEach((bw, i) => { rr(w - 36 - [160, 98, 40][i], 66, bw, 12, 6); fill(p.dim); });
  g.fillStyle = p.line; g.fillRect(0, 98, w, 1.5);

  g.fillStyle = p.fg; g.font = `800 30px ${SANS}`; g.textBaseline = "alphabetic";
  g.fillText("Hello, web.", 26, 150);
  [w - 120, w - 190].forEach((bw, i) => { rr(26, 166 + i * 18, bw, 9, 4.5); fill(p.dim); });
  rr(26, 214, 108, 34, 17); fill(p.accent);
  g.fillStyle = p.bg; g.font = `700 14px ${SANS}`; g.fillText("Get started", 45, 236);
  g.fillStyle = p.accent; g.font = `600 14px ${SANS}`; g.fillText("Read the docs \u2192", 152, 236);

  const cw = (w - 26 * 2 - 14) / 2;
  [[0, 40], [1, 205]].forEach(([i, hue]) => {
    const cx = 26 + i * (cw + 14), cy = 272;
    rr(cx, cy, cw, h - cy - 22, 12); fill(p.alt);
    rr(cx + 0.5, cy + 0.5, cw - 1, h - cy - 23, 12); g.strokeStyle = p.line; g.lineWidth = 1; g.stroke();
    photo(cx + 10, cy + 10, cw - 20, 86, hue);
    rr(cx + 12, cy + 108, cw * 0.7, 10, 5); fill(p.fg);
    rr(cx + 12, cy + 128, cw * 0.5, 8, 4); fill(p.dim);
  });
  g.restore();
  g.restore();
}

// Big sticker label, deliberately loud.
function sticker(text, x, y, rot, bg, fg) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.font = `900 40px ${SANS}`;
  const w = g.measureText(text).width + 44;
  g.shadowColor = "rgba(0,0,0,0.5)"; g.shadowBlur = 18; g.shadowOffsetY = 8;
  rr(0, -34, w, 62, 14); fill(bg);
  g.shadowColor = "transparent";
  g.fillStyle = fg; g.textBaseline = "alphabetic"; g.fillText(text, 22, 11);
  g.restore();
}

// Chunky red arrow with a white keyline so it pops on any background.
function arrow(cx, cy, len, thick, rot) {
  g.save(); g.translate(cx, cy); g.rotate(rot);
  const h = len / 2, t = thick / 2, head = thick * 1.55, neck = len * 0.08;
  g.beginPath();
  g.moveTo(-h, -t); g.lineTo(h - head - neck, -t); g.lineTo(h - head - neck, -head);
  g.lineTo(h, 0); g.lineTo(h - head - neck, head); g.lineTo(h - head - neck, t); g.lineTo(-h, t); g.closePath();
  g.shadowColor = "rgba(0,0,0,0.55)"; g.shadowBlur = 30; g.shadowOffsetY = 14;
  g.lineJoin = "round"; g.lineWidth = 18; g.strokeStyle = "#fff"; g.stroke();
  g.shadowColor = "transparent";
  const gr = g.createLinearGradient(-h, 0, h, 0);
  gr.addColorStop(0, "#ff4d4d"); gr.addColorStop(1, "#e5173f");
  g.fillStyle = gr; g.fill();
  g.restore();
}

function title() {
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.font = `900 54px ${SANS}`; g.fillStyle = "#ffffff";
  g.fillText("Omarchy Web Retheme", W / 2, 62);
  g.font = `500 23px ${SANS}`; g.fillStyle = "#a6adc8";
  g.fillText("Make every website match your terminal theme.", W / 2, 98);
  g.textAlign = "left";
}

function draw() {
  background();
  const S = 1.14, ww = 380, wh = 340;
  site({ x: 100, y: 172, w: ww, h: wh, scale: S, rot: -0.03, p: THEMES.light, shadow: 0.35 });
  site({ x: 1600 - 100 - ww * S, y: 172, w: ww, h: wh, scale: S, rot: 0.03, p: THEMES.catppuccin });
  arrow(800, 350, 300, 78, -0.06);
  sticker("BEFORE", 64, 172, -0.06, "#ffffff", "#c5221f");
  sticker("AFTER", 1600 - 64 - 190, 172, 0.06, "#a6e3a1", "#11111b");
  title();
}
document.fonts.ready.then(draw);
</script>
